<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/AgendaMedica.png" type="image/x-icon">
    <title>Cadastro de Convênio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="layout">
    <header>
        <h1>Cadastro de Convênio </h1>
    </header>
        <main class="main">
            <div class="formulario">
                <p>
                    <label>Convênio:</label>
                    <input type="text" id="Convenio" placeholder="Digite o nome do convênio">
                    <select id="ConvenioStatus">
                        <option value="">Selecione o status</option>
                    </select>
                </p>
            </div>
            <button id="btn_cadastrar_convenio" type="button">Cadastrar</button>
            <p id="Mensagem_Convenio"></p>
        </main>
    <footer>
        <a href="MenuClinica.html" class="btn_voltar_menu">Voltar para o menu</a>
    </footer>
    <script src="service.js"></script>
</body>
</html>
