<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinica Médica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="layout">
    <header>
        <h1 id="Cadastro"> Cadastro do Médico </h1>
        <p>Adicione os dados do médico</p>
    </header>
        <main class="main">
            <div class="formulario">
                <div class="left">
                    <p>
                        <label>CRM:</label>
                        <input type="text" id="CRM" placeholder="Digite o CRM">
                    </p>
                    <p>
                        <label>CPF:</label>
                        <input type="text" id="CPF" placeholder="Digite o CPF">
                    </p>
                    <p>
                        <label>Nome:</label>
                        <input type="text" id="Nome" placeholder="Digite o nome">
                    </p>
                    <p>
                        <label>Telefone:</label> 
                        <input type="text" id="Telefone" placeholder="Digite o telefone">
                    </p>
                    <p>
                        <label>Endereço:</label> <input type="text" id="Endereço" placeholder="Digite o endereço">
                    </p>
                    <p>
                        <label>CEP:</label>
                        <input type="text" id="CEP" placeholder="Digite o CEP">
                    </p>
                    <p>
                        <label>Cidade:</label> 
                        <input type="text" id="Cidade" placeholder="Digite a cidade">
                    </p>
                </div>
                <div class="right">
                    <p>
                        <label>Bairro:</label>
                        <input type="text" id="Bairro" placeholder="Digite o bairro">
                    </p>
                    <p>
                        <label>Número:</label>
                        <input type="text" id="Numero" placeholder="Digite o número">
                    </p>
                    <p>
                        <label>Complemento:</label>
                        <input type="text" id="Complemento" placeholder="Digite o complemento">
                    </p>
                    <p>
                        <label>UF:</label>
                        <input type="text" id="UF" placeholder="Digite a UF">
                    </p>
                    <p>
                        <label>Sexo:</label>
                        <select id="Sexo">
                        <option value="">Selecione o sexo</option>
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                    </select></p>
                    <p>
                        <label>Especialidade:</label>
                        <select id="Especialidade">
                            <option value="">Selecione uma especialidade</option>
                        </select>
                    </p>
                    <p>
                        <label>Status:</label>
                        <select id="Status">
                            <option value="">Selecione um status</option>
                        </select>
                    </p>
                </div>
            </div>
            <button id="btn_cadastrarMedico" type="button">Cadastrar</button>
            <p id="Mensagem"></p>
        </main>
    <footer>
        <a href="MenuClinica.html" class="btn_voltar_menu">Voltar para o menu</a>
        <a href="diasDisponiveis.html" class="btn_voltar_menu">Cadastrar Dias Disponíveis</a>
        <a href="medicosDispo.html" class="btn_voltar_menu">Ver Médicos disponíveis</a>
    </footer>
    <script src="service.js"></script>
</body>
</html>
