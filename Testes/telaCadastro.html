<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styleteste.css"> 
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- Imagem de login -->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo! Por favor, faça login.</p>
                <form>
                    <button id="login" onclick="return validacaoLogin() && Login();">Entrar</button>
                </form>
            </div>
        </section>
    </main>
    <script src="script.js"></script>  
</body>
</html>
