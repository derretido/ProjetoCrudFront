<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/AgendaMedica.png" type="image/x-icon">
    <title>Cadastro de Agendamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="layout">
    <header>
        <h1 id="Cadastro"> Cadastro de Agendamentos</h1>
    </header>
    <main class="main">
        <div class="formulario">
            <div class="left">
                <p>
                    <label>CRM do Médico:</label>
                    <select id="CRM">
                        <option value="">Selecione o médico</option>
                    </select>
                </p>
                <p>
                    <label>RG do Paciente:</label>
                    <select id="RG/CIN">
                        <option value="">Selecione o paciente</option>
                    </select>
                </p>
                <p>
                    <label>Período:</label>
                    <select id="Periodo">
                        <option value="">Selecione um período</option>
                    </select>
                </p>
            </div>
            <div class="right">
                <p>
                    <label>Status:</label>
                    <select id="StatusAgenda">
                        <option value="">Selecione um status</option>
                    </select>
                </p>
                <p>
                    <label>Horário:</label>
                    <input type="time" id="Horario">
                </p>
                <p>
                    <label>Data:</label>
                    <input type="date" id="Data">
                </p>
            </div>
        </div>
            <button class="btn-cadastrar" id="btn_cadastrarAgendamentos" type="button">Cadastrar</button>
            <p id="Mensagem_Agendamento"></p>
    </main>
        <footer>
            <a href="MenuClinicaADMIN.html" class="btn_voltar_menu">Voltar para o menu</a>
            
        </footer>
    <script src="service.js"></script>
</body>
</html>
