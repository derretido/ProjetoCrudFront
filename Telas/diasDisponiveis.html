<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/AgendaMedica.png" type="image/x-icon">
    <title>Cadastro de Dias Disponíveis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="layout">
    <header>
        <h1 id="Cadastro"> Cadastro de Dias Disponíveis </h1>
    </header>
    <main class="main">
        <div class="formulario">
            <div class="left">
                <p>
                    <label>CRM do Médico:</label>
                    <select id="CRM">
                        <option value="">Selecione o médico</option>
                    </select>
                </p>
                <p>
                    <label>Dia da Semana:</label>
                    <select id="DiaSemana"><option value="">Selecione o dia da semana</option></select>
                </p>
                <p>
                    <label>Horário:</label>
                    <input type="time" id="Horario_inicial">
                </p>
                <p>
                    <label>Horário Final:</label>
                    <input type="time" id="Horario_final">
                </p>
            </div>
            <div class="right">
                <p>
                    <label>Período:</label>
                    <select id="Periodo">
                        <option value="">Selecione um período</option>
                    </select>
                </p>
                <p>
                    <label>Quantidade de atendimentos:</label>
                    <select id="Qtde_maxima"></select>
                </p>
                <p>
                    <label>Tempo de Consulta:</label>
                    <select id="Tempo_consulta"><option value="">Selecione o tempo de consulta</option></select>
                </p>
            </div>
        </div>
        <button class="btn-cadastrar" id="btn_cadastrarDiasDisponiveis" type="button">Cadastrar</button>
        <p id="Mensagem_DiasDispo"></p>
    </main>
        <footer>
                <a href="MenuClinicaADMIN.html" class="btn_voltar_menu">Voltar para o menu</a>
        </footer>
    <script src="service.js"></script>
</body>
</html>
